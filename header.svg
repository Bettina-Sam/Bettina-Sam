</defs>
<style>
  .name  { font: 700 60px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill:#fff; letter-spacing:1px; animation: rise 1s ease-out both; }
  .sub   { font: 600 27px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill:#c4b5fd; animation: rise 1s ease-out .35s both; }
  .role  { font: 500 20px Consolas, 'Courier New', monospace; fill:#94a3b8; opacity:0; animation: roles 12s ease-in-out infinite; }
  .r2 { animation-delay:4s; } .r3 { animation-delay:8s; }
  .bar   { animation: grow 1.1s ease-out .2s both; transform-origin: 60px 0; transform-box: fill-box; }
  .flow  { stroke-dasharray: 10 14; animation: dash 1.6s linear infinite; }
  .fl1 { animation: float 7s ease-in-out infinite; }
  .fl2 { animation: float 9s ease-in-out -3s infinite; }
  .fl3 { animation: float 8s ease-in-out -5s infinite; }
  .tw  { animation: twinkle 4s ease-in-out infinite; }
  @keyframes rise { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes roles { 0% {opacity:0; transform:translateY(8px);} 4% {opacity:1; transform:none;} 30% {opacity:1; transform:none;} 34% {opacity:0; transform:translateY(-8px);} 100% {opacity:0;} }
  @keyframes dash { to { stroke-dashoffset: -48; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes twinkle { 0%,100% { opacity:.12; } 50% { opacity:.95; } }
</style>
